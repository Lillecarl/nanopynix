; This subproject keeps its own pytest configuration, in the same shape and
; for the same reason as `../grpclib-transports/pytest.ini`. The repository's
; own suite (../pytest.ini) installs beartype instrumentation over nanopynix,
; adds nine nanopynix-specific markers and prepends five source trees to
; `sys.path`. A helper here must stay useful to a project that never loads
; Nix, so this suite must not read any of that.
;
; **`anyio_mode = auto` is the line that makes the tests run.** Without it,
; anyio's plugin stays in strict mode and every `async def` test reports
; "async def functions are not natively supported" and fails. The root
; `../pytest.ini` did not supply it: pytest anchors the rootdir at the nearest
; `pyproject.toml`, which is this project's own, so the root file is out of
; scope. The `check-test-support` gate found this on its first build, and a
; run from the repository dev shell did not.
[pytest]
anyio_mode = auto
testpaths = tests
