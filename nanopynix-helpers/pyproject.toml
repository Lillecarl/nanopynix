[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanopynix-helpers"
version = "0.1.0"
description = "Reusable helpers layered on nanopynix (kept out of its core to isolate extra dependencies)"
authors = [{ name = "nanopynix contributors" }]
requires-python = ">=3.10"
dependencies = ["nanopynix", "tree-sitter", "tree-sitter-nix"]

[project.optional-dependencies]
# `nanopynix[test]` carries pytest and the two projects this suite registers
# in `tests/conftest.py`: `test-support` for the plugin, and
# `nanopynix-testing` for the beartype hook. Named through nanopynix rather
# than directly, because this suite imports `nanopynix.rpc` and
# `nanopynix_proto` as well and would need that extra either way.
test = ["nanopynix[test]"]

[project.urls]
Homepage = "https://github.com/lillecarl/nanopynix"

[tool.hatch.build.targets.wheel]
packages = ["src/nanopynix_helpers"]
