[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-agent"
version = "0.1.0"
description = "AI-agent-friendly pytest configuration: minimal terminal noise, full per-test detail on disk"
requires-python = ">=3.10"
# PEP 639. The repository is Apache-2.0. `nanopynix-bindings` alone is
# LGPL-2.1-or-later, because that project links libnixexpr and libnixstore,
# and `AGENTS.md` says why the two live together without a conflict.
#
# The file is a copy of the one at the root of the repository, because the
# source root of this project is this directory, and a path above it is not in
# the sdist.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = ["pytest>=8", "pyinstrument"]

[project.entry-points.pytest11]
agent = "pytest_agent.plugin"

[project.scripts]
pytest-agent = "pytest_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
