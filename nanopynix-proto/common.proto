syntax = "proto3";

package nix.common;

// ── Enums ──────────────────────────────────────────

enum NixType {
  NIX_TYPE_UNSPECIFIED = 0;
  NIX_TYPE_THUNK = 1;
  NIX_TYPE_INT = 2;
  NIX_TYPE_FLOAT = 3;
  NIX_TYPE_BOOL = 4;
  NIX_TYPE_STRING = 5;
  NIX_TYPE_PATH = 6;
  NIX_TYPE_NULL = 7;
  NIX_TYPE_ATTRS = 8;
  NIX_TYPE_LIST = 9;
  NIX_TYPE_FUNCTION = 10;
  NIX_TYPE_EXTERNAL = 11;
  NIX_TYPE_UNKNOWN = 12;
}

enum ResultType {
  RESULT_TYPE_UNSPECIFIED = 0;
  RESULT_TYPE_FILE_LINKED = 100;
  RESULT_TYPE_BUILD_LOG_LINE = 101;
  RESULT_TYPE_UNTRUSTED_PATH = 102;
  RESULT_TYPE_CORRUPTED_PATH = 103;
  RESULT_TYPE_SET_PHASE = 104;
  RESULT_TYPE_PROGRESS = 105;
  RESULT_TYPE_SET_EXPECTED = 106;
  RESULT_TYPE_POST_BUILD_LOG_LINE = 107;
  RESULT_TYPE_FETCH_STATUS = 108;
}

enum LogLevel {
  ERROR = 0;
  WARN = 1;
  NOTICE = 2;
  INFO = 3;
  TALKATIVE = 4;
  CHATTY = 5;
  DEBUG = 6;
  VOMIT = 7;
}

// ── Core messages ──────────────────────────────────

message ValueHandle {
  int64 handle = 1;
  NixType type = 2;
}

message PathInfo {
  string path = 1;
  string nar_hash = 2;
  int64 nar_size = 3;
  optional int64 registration_time = 4;
  optional string deriver = 5;
  repeated string references = 6;
  optional string ca = 7;
  bool ultimate = 8;
  // Narinfo signatures, as Nix renders them. Empty for a locally built path
  // that nothing has signed -- which is not the same as "this store does not
  // report signatures", the state this field's absence used to be
  // indistinguishable from.
  repeated string sigs = 9;
}

message BuildResult {
  // The derivation, as a store path -- not the `^` DerivedPath spelling this
  // used to carry. The one exception is a dynamic derivation, where Nix's own
  // serialization of a derivation that must itself be built is `<drv>^<out>`.
  string drv_path = 1;
  bool success = 2;
  string status = 3;
  string error_msg = 4;
  // Which outputs the request selected: empty = a DerivedPath::Opaque ("fetch
  // this path"), ["*"] = every output, otherwise the named ones in Nix's
  // sorted order. Empty and ["*"] are different requests, which is why this is
  // a field rather than something a caller re-derives from drv_path.
  repeated string outputs = 5;
}

message BuildResultList {
  repeated BuildResult results = 1;
}

message MissingInfo {
  repeated string will_build = 1;
  repeated string will_substitute = 2;
  repeated string unknown = 3;
  int64 download_size = 4;
  int64 nar_size = 5;
}

// ── Attrs value (string | int | bool) ──────────────

message AttrsValue {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    bool bool_value = 3;
  }
}

message AttrsMap {
  map<string, AttrsValue> entries = 1;
}

message Input {
  map<string, AttrsValue> attrs = 1;
}

message FlakeRef {
  map<string, AttrsValue> attrs = 1;
}

// One node of the lock graph, as `LockFile::findInput` returns it. The name is
// Nix's own name for this node.
//
// This replaces a `LockedInput` message that held the inputs a `flake.nix`
// *declares*. That map could not carry a `rev`, a transitive node, or a
// `follows` edge, so it reported the original reference under a name that said
// locked. The lock graph itself now travels as the JSON of
// `LockFile::toJSON()`, inside the metadata object.
message LockedNode {
  string locked_ref = 1;
  string original_ref = 2;
  bool is_flake = 3;
}

message LockedFlake {
  int64 handle = 1;
  string description = 2;
}

// ── Scalar value (JSON scalar: str|int|float|bool|None) ──

message NullValue {}

message ScalarValue {
  oneof kind {
    string string_value = 1;
    int64 int_value = 2;
    double float_value = 3;
    bool bool_value = 4;
    NullValue null_value = 5;
  }
}

// ── Recursive wire types ───────────────────────────

message DeepValue {
  oneof kind {
    ScalarValue scalar = 1;
    DeepList list = 2;
    DeepAttrs attrs = 3;
    ValueHandle remote_value = 4;
  }
}

message DeepList {
  repeated DeepValue items = 1;
}

message DeepAttrs {
  map<string, DeepValue> entries = 1;
}

message CallArg {
  oneof kind {
    ScalarValue scalar = 1;
    CallArgList list = 2;
    CallArgAttrs attrs = 3;
    RemoteCallArg remote_value = 4;
  }
}

message CallArgList {
  repeated CallArg items = 1;
}

message CallArgAttrs {
  map<string, CallArg> entries = 1;
}

message RemoteCallArg {
  int64 handle = 1;
}

// ── PrimOp spec ────────────────────────────────────

message PrimOpSpec {
  string name = 1;
  int32 arity = 2;
  repeated string args = 3;
  string doc = 4;
  string import_path = 5;
  bool rpc = 6;
}

// ── Log event ──────────────────────────────────────

message NixLogEvent {
  string action = 1;
  string args_json = 2;
  optional ResultType result_type = 3;
}

message RequestFinalized {}

// How many log events the worker discarded before this point in the stream.
//
// The worker drops a log line rather than stall Nix: a caller who stops
// reading must not stop the evaluation. Without this event the caller reads a
// short log and cannot tell that it is short.
//
// This rides the same stream as the events it replaces, and the worker sends
// it at the point where the loss happened, so the position in the stream tells
// the reader which part of the log is incomplete.
message EventsDropped {
  uint64 count = 1;
}

message LogEvent {
  int64 request_id = 1;

  oneof payload {
    NixLogEvent nix_log = 2;
    RequestFinalized request_finalized = 3;
    EventsDropped events_dropped = 4;
  }
}

// ── Derivation ─────────────────────────────────────

// One node of Nix's `DerivedPathMap`, which is a tree: each output name can
// itself carry a whole node, once per level of dynamic derivation. Recursive
// for that reason -- `dynamic_outputs` was `map<string, string>` at field 2,
// which could hold one output name per child and nothing below it.
//
// Field 2 is retired rather than reused so a stale generated module fails to
// decode instead of reading the new message as a string.
message DerivationOutputs {
  reserved 2;

  repeated string outputs = 1;
  map<string, DerivationOutputs> dynamic_outputs = 3;
}

message DerivationOutput {
  string type = 1;
  optional string path = 2;
  optional string ca = 3;
  optional string method = 4;
  optional string hash_algo = 5;
}

message Derivation {
  string name = 1;
  string system = 2;
  string builder = 3;
  repeated string args = 4;
  map<string, string> env = 5;
  map<string, DerivationOutputs> input_drvs = 6;
  repeated string input_srcs = 7;
  map<string, DerivationOutput> outputs = 8;
  // Nix's `__json` payload, verbatim, for a `__structuredAttrs = true`
  // derivation. Not recoverable from `env`: Nix's parser moves the attribute
  // out of the environment into `Derivation::structuredAttrs`, so before this
  // field existed those attributes were reported by nothing at all.
  optional string structured_attrs = 9;
}

// ── Error detail ───────────────────────────────────
//
// Every nix::Error carries a nix::ErrorInfo -- severity, source position,
// the evaluation trace, "did you mean ...?" suggestions -- that e.what()
// cannot express and that only C++ has access to. These messages are how it
// crosses the worker RPC: packed into a google.protobuf.Any and carried on
// google.rpc.Status.details, which is the standard gRPC channel for error
// detail and therefore readable by any language's gRPC tooling.

// A position in Nix source.
//
// `file` is Pos::print's rendering of the origin rather than a plain path:
// an origin is a variant that may be a real file, but equally a string
// («string») or stdin («stdin»), neither of which has a path to report.
message SourcePos {
  string file = 1;
  uint32 line = 2;
  uint32 column = 3;
}

// One frame of the evaluation trace -- what `--show-trace` prints.
message ErrorTrace {
  string hint = 1;
  SourcePos pos = 2;
}

message NixErrorInfo {
  // Nix's own rendering of the error, as its CLI would print it. Derived
  // from the fields below rather than independent of them, which is why it
  // is the first thing dropped when the payload has to be trimmed.
  string raw = 1;

  LogLevel level = 2;
  string msg = 3;
  SourcePos pos = 4;
  bool is_from_expr = 5;
  int32 status = 6;
  repeated ErrorTrace traces = 7;

  // Trace frames were dropped -- by the C++ frame cap, or to fit the
  // status trailer's byte budget. Distinguishes "no trace" from "trace lost".
  bool truncated = 8;

  repeated string suggestions = 9;
}

// Which error this is, as a name rather than as prose.
//
// The status message carries "TypeName: text", which is enough for a Python
// client to recover a Nix C++ class and nothing else. This carries the class
// as a field, so a client in any language reads it without splitting a
// string, and a Python client raises the class the worker actually raised.
//
// Rides the same status trailer as NixErrorInfo, and is never trimmed: it is
// a few dozen bytes and it is the most valuable thing in the trailer.
//
// The two fields name two different vocabularies, and exactly one is set.
message ErrorIdentity {
  // The Nix C++ exception class, when Nix raised the error. e.g.
  // "EvalError". These are the names nanobind registers in
  // nanopynix-bindings, and they may be coarser than the message: Nix
  // reports both a type error and a hash mismatch as plain nix::EvalError,
  // so a client may narrow this by message but must never widen it.
  string nix_type = 1;

  // The nanopynix or Python class, when Nix did not raise the error. e.g.
  // "SettingNotLiveError", "ValueError".
  string class_name = 2;
}
