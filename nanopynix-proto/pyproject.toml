[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanopynix-proto"
version = "0.1.0"
description = "gRPC protobuf definitions for nanopynix (betterproto2 compiled)"
authors = [{ name = "nanopynix contributors" }]
requires-python = ">=3.13"
# PEP 639. The repository is Apache-2.0.
#
# The file is a copy of the one at the root of the repository, because the
# source root of this project is this directory, and a path above it is not in
# the sdist.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = ["betterproto2", "protobuf", "pydantic", "grpclib"]

[tool.hatch.build.targets.wheel]
packages = ["src/nanopynix_proto"]
