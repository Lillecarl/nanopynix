syntax = "proto3";

package nix.eval;

import "common.proto";

service EvalService {
  rpc OpenEval(OpenEvalRequest) returns (OpenEvalResponse);
  rpc CloseEval(CloseEvalRequest) returns (CloseEvalResponse);
  rpc ConfigureEval(ConfigureEvalRequest) returns (ConfigureEvalResponse);
  rpc EvalFile(EvalFileRequest) returns (nix.common.ValueHandle);
  rpc EvalString(EvalStringRequest) returns (nix.common.ValueHandle);
  rpc BeginRepl(BeginReplRequest) returns (BeginReplResponse);
  rpc ReplLoadFile(ReplLoadFileRequest) returns (nix.common.ValueHandle);
  rpc ReplProcessLine(ReplProcessLineRequest) returns (ReplProcessLineResponse);
  rpc ReplAddAttrs(ReplAddAttrsRequest) returns (ReplAddAttrsResponse);
  rpc ReplScopeNames(ReplScopeNamesRequest) returns (ReplScopeNamesResponse);
  rpc ResetFileCache(ResetFileCacheRequest) returns (ResetFileCacheResponse);
  rpc Force(ForceRequest) returns (nix.common.ForceValue);
  rpc ForceDeep(ForceDeepRequest) returns (nix.common.DeepValue);
  rpc ForceJson(ForceJsonRequest) returns (ForceJsonResponse);
  rpc CoerceToString(CoerceToStringRequest) returns (CoerceToStringResponse);
  rpc RealiseString(RealiseStringRequest) returns (RealiseStringResponse);
  rpc RealiseArgv(RealiseArgvRequest) returns (RealiseArgvResponse);
  rpc EditLocation(EditLocationRequest) returns (EditLocationResponse);
  rpc Attr(AttrRequest) returns (nix.common.ValueHandle);
  rpc ListGet(ListGetRequest) returns (nix.common.ValueHandle);
  rpc ListLength(ListLengthRequest) returns (ListLengthResponse);
  rpc AttrNames(AttrNamesRequest) returns (AttrNamesResponse);
  rpc HasAttr(HasAttrRequest) returns (HasAttrResponse);
  rpc TypeName(TypeNameRequest) returns (TypeNameResponse);
  rpc AutoCall(AutoCallRequest) returns (nix.common.ValueHandle);
  rpc Call(CallRequest) returns (nix.common.ValueHandle);
  rpc Build(BuildRequest) returns (BuildResponse);
  rpc LockFlake(LockFlakeRequest) returns (nix.common.LockedFlake);
  rpc CallLockedFlake(CallLockedFlakeRequest) returns (nix.common.ValueHandle);
  rpc WriteLockFile(WriteLockFileRequest) returns (WriteLockFileResponse);
  rpc ReleaseLockedFlake(ReleaseLockedFlakeRequest) returns (ReleaseLockedFlakeResponse);
  rpc EvalFlake(EvalFlakeRequest) returns (nix.common.ValueHandle);
  rpc GetFlake(GetFlakeRequest) returns (nix.common.FlakeRef);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc ReleaseAll(ReleaseAllRequest) returns (ReleaseAllResponse);
}

message OpenEvalRequest {
  int64 request_id = 1000;
  int64 store_handle = 1;
  map<string, string> eval_settings = 2;
  map<string, string> fetch_settings = 3;
}
message OpenEvalResponse {
  int64 eval_handle = 1;
}

message CloseEvalRequest {
  int64 request_id = 1000;
  int64 eval_handle = 100;
}
message CloseEvalResponse {}

message ConfigureEvalRequest {
  int64 request_id = 1000;
  map<string, string> eval_settings = 1;
  map<string, string> fetch_settings = 2;
  int64 eval_handle = 100;
}
message ConfigureEvalResponse {}

message EvalFileRequest {
  int64 request_id = 1000;
  string path = 1;
  int64 eval_handle = 100;
}

message EvalStringRequest {
  int64 request_id = 1000;
  string expr = 1;
  string source_name = 2;
  int64 eval_handle = 100;
}

message BeginReplRequest {
  int64 request_id = 1000;
  int64 eval_handle = 100;
}
message BeginReplResponse {}

message ReplLoadFileRequest {
  int64 request_id = 1000;
  string path = 1;
  int64 eval_handle = 100;
}

message ReplProcessLineRequest {
  int64 request_id = 1000;
  string line = 1;
  string source_name = 2;
  int64 eval_handle = 100;
}
message ReplProcessLineResponse {
  bool is_binding = 1;
  nix.common.ValueHandle value = 2;
}

message ReplAddAttrsRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message ReplAddAttrsResponse {
  repeated string names = 1;
}

message ReplScopeNamesRequest {
  int64 request_id = 1000;
  int64 eval_handle = 100;
}
message ReplScopeNamesResponse {
  repeated string names = 1;
}

message ResetFileCacheRequest {
  int64 request_id = 1000;
  int64 eval_handle = 100;
}
message ResetFileCacheResponse {}

message ForceRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}

message ForceDeepRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}

message ForceJsonRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  bool copy_to_store = 2;
  int64 eval_handle = 100;
}
message ForceJsonResponse {
  string json = 1;
}

// `builtins.toString` on the worker side. Distinct from RealiseString: this
// coerces only, it does not build or copy the store paths the result names.
message CoerceToStringRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message CoerceToStringResponse {
  string value = 1;
}

message RealiseStringRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message RealiseStringResponse {
  string value = 1;
}

message RealiseArgvRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message RealiseArgvResponse {
  repeated string argv = 1;
}

message EditLocationRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message EditLocationResponse {
  string path = 1;
  uint32 line = 2;
}

message AttrRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  string name = 2;
  int64 eval_handle = 100;
}

message ListGetRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int32 index = 2;
  int64 eval_handle = 100;
}

message ListLengthRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message ListLengthResponse {
  int32 length = 1;
}

message AttrNamesRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message AttrNamesResponse {
  repeated string names = 1;
}

message HasAttrRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  string name = 2;
  int64 eval_handle = 100;
}
message HasAttrResponse {
  bool has = 1;
}

message TypeNameRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message TypeNameResponse {
  nix.common.NixType type = 1;
}

message AutoCallRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}

message CallRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  repeated nix.common.CallArg args = 2;
  int64 eval_handle = 100;
}

message BuildRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int32 build_mode = 2;
  int64 build_store_handle = 3;
  int64 eval_handle = 100;
}
message BuildResponse {
  string drv_path = 1;
  map<string, string> outputs = 2;
  repeated nix.common.BuildResult results = 3;
}

message LockFlakeRequest {
  int64 request_id = 1000;
  string ref = 1;
  oneof update_inputs {
    bool update_all = 2;
    UpdateInputsList update_inputs_list = 3;
  }
  bool write_lock_file = 4;
  map<string, string> flake_settings = 5;
  int64 eval_handle = 100;
}

message UpdateInputsList {
  repeated string inputs = 1;
}

message CallLockedFlakeRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}

message WriteLockFileRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message WriteLockFileResponse {}

message ReleaseLockedFlakeRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message ReleaseLockedFlakeResponse {}

message EvalFlakeRequest {
  int64 request_id = 1000;
  string ref = 1;
  bool write_lock_file = 2;
  map<string, string> flake_settings = 3;
  int64 eval_handle = 100;
}

message GetFlakeRequest {
  int64 request_id = 1000;
  string ref = 1;
  int64 eval_handle = 100;
}

message ReleaseRequest {
  int64 request_id = 1000;
  int64 handle = 1;
  int64 eval_handle = 100;
}
message ReleaseResponse {}

message ReleaseAllRequest {
  int64 request_id = 1000;
  int64 eval_handle = 100;
}
message ReleaseAllResponse {}
