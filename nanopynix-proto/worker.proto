syntax = "proto3";

package nix.worker;

import "common.proto";

service WorkerService {
  rpc Init(InitRequest) returns (InitResponse);
  rpc OpenStore(OpenStoreRequest) returns (OpenStoreResponse);
  rpc CloseStore(CloseStoreRequest) returns (CloseStoreResponse);
  rpc GetVerbosity(GetVerbosityRequest) returns (GetVerbosityResponse);
  rpc SetVerbosity(SetVerbosityRequest) returns (SetVerbosityResponse);
  rpc SubscribeLogs(SubscribeLogsRequest) returns (stream nix.common.LogEvent);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message InitRequest {
  int64 request_id = 1000;
  reserved 6, 7, 8; // formerly pure_eval, restrict_eval, allowed_uris — now per-EvalState, see OpenEvalRequest
  reserved "pure_eval", "restrict_eval", "allowed_uris";
  string store_uri = 1;
  optional string nix_conf = 2;
  map<string, string> settings = 3;
  repeated string experimental_features = 4;
  repeated nix.common.PrimOpSpec primops = 5;
  optional nix.common.LogLevel verbosity = 9;
  repeated string nix_path = 10;
  bool load_config = 11;
}

message InitResponse {
  string status = 1;
}

message SubscribeLogsRequest {}

message OpenStoreRequest {
  int64 request_id = 1000;
  string uri = 1;
}
message OpenStoreResponse {
  int64 store_handle = 1;
  string uri = 2;
  string store_dir = 3;
}

message CloseStoreRequest {
  int64 request_id = 1000;
  int64 store_handle = 1;
  bool force = 2;
}
message CloseStoreResponse {}

message GetVerbosityRequest { int64 request_id = 1000; }
message GetVerbosityResponse {
  nix.common.LogLevel verbosity = 1;
}

message SetVerbosityRequest {
  int64 request_id = 1000;
  nix.common.LogLevel verbosity = 1;
}
message SetVerbosityResponse {
  nix.common.LogLevel verbosity = 1;
}

message ShutdownRequest { int64 request_id = 1000; }
message ShutdownResponse {}
