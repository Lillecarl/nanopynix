syntax = "proto3";

package nix.manager;

import "common.proto";

service ManagerPrimopService {
  rpc Call(CallPrimopRequest) returns (CallPrimopResponse);
}

message CallPrimopRequest {
  int64 request_id = 1000;
  string name = 1;
  repeated nix.common.DeepValue args = 2;
}

message CallPrimopResponse {
  nix.common.DeepValue value = 1;
}
