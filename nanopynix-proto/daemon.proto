syntax = "proto3";

package nix.daemon;

import "common.proto";

// Control plane for an isolated native-Nix daemon worker. The Nix daemon
// protocol itself remains on the Unix socket; it is never transported by gRPC.
service DaemonService {
  rpc Start(StartDaemonRequest) returns (StartDaemonResponse);
  rpc Stop(StopDaemonRequest) returns (StopDaemonResponse);
  rpc GetStatus(GetDaemonStatusRequest) returns (GetDaemonStatusResponse);
  rpc SubscribeLogs(SubscribeDaemonLogsRequest) returns (stream nix.common.LogEvent);
}

message StartDaemonRequest {
  int64 request_id = 1000;
  string socket_path = 1;
  string store_uri = 2;
  optional string nix_conf = 3;
  map<string, string> settings = 4;
  bool load_config = 5;
}

message StartDaemonResponse {
  string socket_path = 1;
}

message StopDaemonRequest { int64 request_id = 1000; }
message StopDaemonResponse {}

message GetDaemonStatusRequest { int64 request_id = 1000; }
message GetDaemonStatusResponse {
  bool running = 1;
  optional string socket_path = 2;
}

message SubscribeDaemonLogsRequest {}
