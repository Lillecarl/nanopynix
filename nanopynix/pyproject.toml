[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanopynix"
version = "0.1.0"
description = "nanobind-based Python bindings for Nix"
authors = [{ name = "nanopynix contributors" }]
requires-python = ">=3.13"
dependencies = [
  "nanopynix-bindings",
  "nanopynix-proto",
  "grpclib-transports",
  "anyio>=4.14",
  "coolname",
  "janus",
  "jsonschema",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "setproctitle",
]

# PEP 639, and the same reasoning as `nanopynix-bindings/pyproject.toml`. The
# classifier is a name, and `license-files` is what puts the text in the built
# artifact. The file is a copy of the one at the root of the repository,
# because the source root of this project is `nanopynix/`.
license = "LGPL-2.1-or-later"
license-files = [ "LICENSE" ]
classifiers = [
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-dependency",
  "pytest-cov",
  "pytest-forked",
  "pytest-xdist",
  "pygit2",
  "beartype",
  "hypothesis",
]

[project.scripts]
nanopynix-worker = "nanopynix.rpc.worker._worker:main"

[project.urls]
Homepage = "https://github.com/lillecarl/nanopynix"

[tool.hatch.build.targets.wheel]
packages = ["src/nanopynix"]
