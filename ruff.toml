target-version = "py313"
line-length = 120

# `pynixd/` is imported and not integrated, and issue #131 is the work that
# changes that. The merge that brought it in preserved both histories and
# changed no file, so that tree still carries its own `ruff.toml`, its own
# pyright settings and its own conventions, now at `pynixd/ruff.toml` and
# `pynixd/pyproject.toml`. Measured on the day of the import: 28 findings
# here, 2 files that `ruff format` would rewrite, and 7629 pyright errors.
#
# Reporting on it from the repository root would say that 356 files are
# wrong, when what is true is that a second project has not yet adopted the
# conventions of this one. Remove this line in #131, one gate at a time.
extend-exclude = ["pynixd"]

[lint]
select = [
  "E",
  "W", # pycodestyle
  "F", # pyflakes (real bugs)
  "I", # isort
]

ignore = [
  "E501", # line length handled by line-length setting
]

[lint.flake8-builtins]
ignorelist = ["eval"]

[lint.per-file-ignores]
# `**/tests/**` and not `tests/**`: issue #130 gives each project its own
# suite, so an entry per project would be a list that the next move forgets to
# extend. It reaches a suite only, never a `src/`. See `ruff-strict.toml`,
# which carries the same glob and the full argument.
"**/tests/**" = [
  "SLF001",
] # tests intentionally inspect private implementation state

[lint.isort]
combine-as-imports = true
known-first-party = [
  # `support` and `_shared_sessions` are `pynix/tests/`'s own modules.
  # pytest puts that directory on `sys.path` because the suite has no
  # `__init__.py`, so they are importable by bare name and isort cannot
  # tell them from a third-party package without being told.
  "_shared_sessions",
  "nanopynix",
  "nanopynix_expr",
  "nanopynix_fetchers",
  "nanopynix_flake",
  "nanopynix_store",
  "nanopynix_util",
  "support",
  # Named here, unlike `nanopynix` and `pynix`, which ruff finds by itself:
  # with no `src` setting it looks for a directory of the same name beside
  # this file, and these two are at `test-support/src/test_support` and
  # `nanopynix-testing/src/nanopynix_testing`. Add a project the same way when
  # its directory name and its module name differ.
  "test_support",
  "nanopynix_testing",
]
