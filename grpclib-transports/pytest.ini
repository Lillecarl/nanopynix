; This subproject keeps its own pytest configuration, so that `pytest
; grpclib-transports` is a self-contained run with its own rootdir. The
; repository's own suite (../pytest.ini) installs beartype instrumentation
; over nanopynix, adds nine nanopynix-specific markers and prepends five
; source trees to `sys.path` -- none of which this library needs, and all of
; which would make a transport failure harder to read.
;
; `testpaths` names `tests` only. `benchmarks` is a measurement run, not a
; correctness gate, so it is opt-in: `pytest grpclib-transports/benchmarks`.
;
; `test_support.plugin` is the *generic* layer of issue #130, and this line is
; what that issue asked for: a subproject reaches the deadline, the hang
; report and the note shim without reaching `nix_environment.py` or the
; beartype hook. It gives this suite a `TimeoutError` that names the tasks and
; the threads still alive, in place of a transport test that hangs until the
; CI job is killed.
;
; `-p` and not `pytest_plugins` in the conftest: `pytest_plugins` is legal
; only in a *top-level* conftest, so it would be legal under this rootdir and
; illegal in a run from the repository root.
[pytest]
anyio_mode = auto
addopts = -p test_support.plugin
testpaths = tests
markers =
    tcp: requires binding TCP sockets; skipped in the Nix build sandbox
