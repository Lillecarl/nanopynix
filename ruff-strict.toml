target-version = "py313"
line-length = 120

[lint]
select = [
  # Pyflakes
  "F",
  # Pycodestyle errors & warnings
  "E",
  "W",
  # isort
  "I",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # flake8-type-checking (TC001-003 ignored below — see rationale; TC004 in
  # particular is kept, and is the rule that actually matters here: it catches
  # an import stranded inside a type-checking block that runtime code needs)
  "TC",
  # Ruff-specific
  "RUF",
  # flake8-comprehensions
  "C4",
  # commented-out code
  "ERA",
  # pyupgrade
  "UP",
  # flake8-builtins
  "A",
  # flake8-use-pathlib
  "PTH",
  # flake8-unused-arguments
  "ARG",
  # Perflint
  "PERF",
  # flake8-return
  "RET",
  # flake8-raise
  "RSE",
  # flake8-print
  "T20",
  # flake8-pie
  "PIE",
  # flake8-2020
  "YTT",
  # flake8-async
  "ASYNC",
  # tryceratops
  "TRY",
  # refurb
  "FURB",
  # flake8-tidy-imports
  "TID",
  # pep8-naming
  "N",
  # flynt
  "FLY",
  # flake8-quotes
  "Q",
  # flake8-future-annotations
  "FA",
  # flake8-pytest-style
  "PT",
  # flake8-blind-except
  "BLE",
  # flake8-todos
  "TD",
  # flake8-logging
  "LOG",
  # pygrep-hooks: require targeted type-checker and lint suppressions,
  # and flag no-paren mock-assert typos
  "PGH003",
  "PGH004",
  "PGH005",
  # pylint — import should be at top-level
  "PLC0415",
  # flake8-bandit
  "S",
  # flake8-datetimez
  "DTZ",
  # mccabe — flag existing complexity hotspots (tracked via noqa) and hold
  # new code to the same bar
  "C901",
  # flake8-annotations (ANN401 ignored below — see rationale)
  "ANN",
  # flake8-commas — only the bare-tuple-comma check; COM812/COM819 are
  # intentionally omitted (see ignore list below): both actively fight
  # `ruff format`'s own trailing-comma/line-splitting decisions rather than
  # just being redundant with it, per ruff's own formatter-compatibility
  # docs. Layout is the formatter's job, not the linter's.
  "COM818",
  # flake8-implicit-str-concat
  "ISC",
  # pydocstyle — curated subset only; this codebase uses flowing-prose
  # docstrings without universal coverage, so presence/mood/blank-line
  # rules (D100-107, D205, D400, D401, D415, ...) are deliberately excluded
  "D301",
  "D402",
  "D404",
  "D414",
  "D417",
  "D418",
  "D419",
  # pylint — the remainder of the family, curated to exclude Preview-status
  # codes, arbitrary-threshold noise, and rules that conflict with an
  # established convention (see ignore list for PLC0414)
  "PLC0105",
  "PLC0131",
  "PLC0132",
  "PLC0205",
  "PLC0206",
  "PLC0207",
  "PLC0208",
  "PLC1802",
  "PLC2401",
  "PLC2403",
