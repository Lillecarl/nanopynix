[pytest]
anyio_mode = auto
pythonpath = nanopynix/src pynix/src ekn/src nanopynix-helpers/src tests/nanopynix
testpaths = tests
# beartype instrumentation (nanopynix, nanopynix_helpers, pynix, ekn) is
# installed directly by tests/support/beartype_hook.py, not via
# pytest-beartype's own beartype_packages ini/CLI option: that option is
# applied from pytest-beartype's pytest_configure hookimpl, which runs after
# tests/conftest.py's own `import nanopynix` (initial-conftest collection
# happens before any plugin's pytest_configure) -- by then the target
# packages are already imported and unhookable. See beartype_hook.py's
# module docstring for the full explanation.
markers =
    concurrency: test intentionally overlaps worker, executor, session, or log operations
    tsan_stress: concurrency test repeated by the ThreadSanitizer workflow
    nix_version(minimum=None, maximum=None, exclude=()): require a linked Nix version range
    nix_capability(name): require a compiled nanopynix/Nix capability
    nix_sanitizer(name): run only under the named sanitizer
    nix_known_issue(exclude=(), sanitizer=None, reason=''): skip an explicitly bounded upstream defect
    l3_inproc: real in-process L3 worker tests with worker-side lifecycle inspection
