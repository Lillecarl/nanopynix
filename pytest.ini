[pytest]
anyio_mode = auto
pythonpath = nanopynix/src pynix/src nanopynix-helpers/src tests/nanopynix
# Every suite of the repository, and issue #130 is why there is more than
# one. The packaged test runner (`nanopynix/tests.nix`) passes no path and
# relies on this line, so a suite that moves into its own project and is
# not named here leaves every job of the CI matrix without a word.
# Each project also has its own `pytest.ini` for a run of that project
# alone; this file wins when the run starts at the repository root,
# because pytest reads one rootdir and one ini.
testpaths = tests nanopynix-helpers/tests pynix/tests
# beartype instrumentation (nanopynix, nanopynix_helpers, pynix). A `-p`
# plugin loads during command-line parsing, which is earlier than any
# conftest, so no conftest has to order its own imports around it.
# pytest-beartype's `beartype_packages` ini option cannot do this at all;
# the hook's module docstring gives the reason.
addopts = -p nanopynix_testing.beartype_hook
markers =
    concurrency: test intentionally overlaps worker, executor, session, or log operations
    soak: runs the existing tests concurrently, for the ThreadSanitizer workflow
    nix_version(minimum=None, maximum=None, exclude=()): require a linked Nix version range
    nix_capability(name): require a compiled nanopynix/Nix capability
    nix_sanitizer(name): run only under the named sanitizer
    nix_known_issue(exclude=(), sanitizer=None, reason=''): skip an explicitly bounded upstream defect
    benchmark: slow, opt-in measurement run; not a correctness gate
    static_gate: runs a CI static-checks tool; ordered first, and never fails the run
    l3_inproc: real in-process L3 worker tests with worker-side lifecycle inspection
    evaluator_in_process: builds a Nix evaluator in the pytest process, without a fixture
