[pytest]
anyio_mode = auto
pythonpath = nanopynix/src pynix/src nanopynix-helpers/src tests/nanopynix
testpaths = tests
# beartype instrumentation (nanopynix, nanopynix_helpers, pynix) is
# installed by `nanopynix_testing.beartype_hook`, imported from the top of
# tests/conftest.py. pytest-beartype's `beartype_packages` ini option cannot
# do it, and that module's docstring gives the reason, and the reason a `-p`
# entry here is possible now and still not used.
markers =
    concurrency: test intentionally overlaps worker, executor, session, or log operations
    soak: runs the existing tests concurrently, for the ThreadSanitizer workflow
    nix_version(minimum=None, maximum=None, exclude=()): require a linked Nix version range
    nix_capability(name): require a compiled nanopynix/Nix capability
    nix_sanitizer(name): run only under the named sanitizer
    nix_known_issue(exclude=(), sanitizer=None, reason=''): skip an explicitly bounded upstream defect
    benchmark: slow, opt-in measurement run; not a correctness gate
    static_gate: runs a CI static-checks tool; ordered first, and never fails the run
    l3_inproc: real in-process L3 worker tests with worker-side lifecycle inspection
    evaluator_in_process: builds a Nix evaluator in the pytest process, without a fixture
