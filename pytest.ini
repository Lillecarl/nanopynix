[pytest]
# addopts = --maxfail=1
timeout = 120
# timeout_method = thread
log_cli = false
# log_cli_level = DEBUG
# log_cli_format = %(message)s (%(filename)s:%(lineno)s)
# log_cli_date_format=%Y-%m-%d %H:%M:%S
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
markers =
    nixbuild: tests that require eu.nixbuild.net access
    store: tests using --store (pynixd as eval store)
    builders: tests using --builders (pynixd as remote builder)
    dag: tests building multi-layer DAG derivations
    slow: tests that are slow and should be excluded by default
    bench: benchmark tests that measure performance
