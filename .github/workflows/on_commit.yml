# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_commit.nix; a pytest run renders this file again.

name: On commit
'on':
  push:
    branches-ignore:
    - ci-develop
  workflow_dispatch:
    inputs:
      jobs:
        default: ''
        description: Comma-separated job IDs to run; leave empty for the full matrix
        required: false
        type: string
env:
  FLAKE_COMPATISH_DISABLE_OVERRIDES: '1'
jobs:
  commit-subjects:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',commit-subjects,')
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - name: Check the Conventional Commits subject of each pushed commit
      run: nix run --file . ciSteps.commit-subjects
      timeout-minutes: 15
  docs-build:
    runs-on: ubuntu-24.04
    needs:
    - commit-subjects
    - static-checks
    - test-asan-git
    - test-asan-nix_2_34
    - test-asan-nix_2_35
    - test-daemon-git
    - test-daemon-nix_2_34
    - test-daemon-nix_2_35
    - test-local-git
    - test-local-nix_2_34
    - test-local-nix_2_35
    - test-nogc-git
    - test-nogc-nix_2_34
    - test-nogc-nix_2_35
    - test-tsan-git
    - test-tsan-nix_2_34
    - test-tsan-nix_2_35
    - test-ubsan-git
    - test-ubsan-nix_2_34
    - test-ubsan-nix_2_35
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 125
    steps:
    - uses: actions/checkout@main
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
      timeout-minutes: 15
    - name: Build documentation
      run: nix build --file . nanopynix-docs --out-link result --print-build-logs
        --print-out-paths
      timeout-minutes: 30
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
      timeout-minutes: 15
    - name: Prepare Pages artifact
      run: nix run --file . ciSteps.prepare-pages
      timeout-minutes: 10
    - uses: actions/upload-pages-artifact@main
      with:
        path: public
      timeout-minutes: 15
  docs-deploy:
    runs-on: ubuntu-24.04
    needs: docs-build
    if: github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      pages: write
    concurrency:
      cancel-in-progress: false
      group: pages
    timeout-minutes: 35
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@main
      with:
        timeout: 900000
      timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
  static-checks:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
