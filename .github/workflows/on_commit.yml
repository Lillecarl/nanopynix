  static-checks:
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Run the gates (ekn-sandbox, format, grpclib-transports, lint, lint-strict,
        pytest-agent, shell, types)
      timeout-minutes: 20
      run: nix build --file . --no-link --print-build-logs --keep-going checks.ekn-sandbox
        checks.format checks.grpclib-transports checks.lint checks.lint-strict checks.pytest-agent
        checks.shell checks.types
    timeout-minutes: 75
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',static-checks,')
    runs-on: ubuntu-24.04
  commit-subjects:
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        fetch-depth: 0
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Check the Conventional Commits subject of each pushed commit
      timeout-minutes: 15
      run: nix run --file . ciSteps.commit-subjects
    timeout-minutes: 55
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',commit-subjects,')
    runs-on: ubuntu-24.04
