        extra_nix_config: |
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
      timeout-minutes: 15
    - name: Run the gates (completion-spike, format, grpclib-transports, lint, lint-strict,
        nanopynix-helpers, nix-daemon-protocol, nixos-module, pynix-isolated, pynixd,
