# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_commit.nix and run `direnv exec . python ci/render.py`.

name: On commit
'on':
  push:
    branches-ignore:
    - ci-develop
  workflow_dispatch:
    inputs:
      jobs:
        type: string
        description: Comma-separated job IDs to run; leave empty for the full matrix
        required: false
        default: ''
jobs:
  docs-build:
    needs:
    - test-git-multi-user
    - test-git-single-user
    - test-nix_2_31-multi-user
    - test-nix_2_31-single-user
    - test-nix_2_34-multi-user
    - test-nix_2_34-single-user
    - test-nix_2_35-multi-user
    - test-nix_2_35-single-user
    - test-tsan-git-multi-user
    - test-tsan-git-single-user
    - test-tsan-nix_2_34-multi-user
    - test-tsan-nix_2_34-single-user
    - test-tsan-nix_2_35-multi-user
    - test-tsan-nix_2_35-single-user
    steps:
    - uses: actions/checkout@main
    - uses: nixbuild/nix-quick-install-action@master
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build documentation
      run: nix build .#nanopynix-docs --out-link result --print-build-logs --print-out-paths
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    - name: Prepare Pages artifact
      run: |
        mkdir -p public
        cp -r --no-preserve=mode,ownership result/. public/
    - uses: actions/upload-pages-artifact@main
      with:
        path: public
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop'
  docs-deploy:
    needs: docs-build
    steps:
    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@main
      id: deployment
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop'
  test-tsan-git-single-user:
    steps:
    - uses: actions/checkout@main
    - uses: nixbuild/nix-quick-install-action@master
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Configure single-user Nix builds
      run: |
        sudo install -d -m 0755 /etc/nix
        printf '%s\n' 'build-users-group =' 'require-drop-supplementary-groups = false' | sudo tee -a /etc/nix/nix.conf
    - name: Build TSAN nanopynix test runner (git, single-user)
      run: nix build ".#nanopynix-tests-git-tsan" --out-link result --print-build-logs
        --print-out-paths
    - name: Enable Nix sandbox namespaces
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        sudo sysctl -w kernel.core_pattern=/tmp/core.%e.%p
        unshare --user --map-root-user --mount --pid --fork --mount-proc true
    - name: Run TSAN-instrumented stress tests (repeated)
      run: |
        set -o pipefail
        LOGFILE="${{ github.workspace }}/tsan-output-git-single-user.log"
        race_found=0
        for i in $(seq 1 5); do
          echo "=== TSAN run $i ===" | tee -a "$LOGFILE"
          status=0
          unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_CORE_DEBUG=1 NANOPYNIX_RPC_TIMEOUT=30 PYTHONDONTWRITEBYTECODE=1 \
            ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --capture=no --run-temp-store-builds \
            -m tsan_stress \
            2>&1 | tee -a "$LOGFILE" || status=$?
          echo "=== TSAN run $i exit status: $status ===" | tee -a "$LOGFILE"
          if grep -q "ThreadSanitizer: data race" "$LOGFILE"; then
            echo "TSAN data race detected on run $i -- stopping early" | tee -a "$LOGFILE"
            race_found=1
            break
          fi
        done
        if [ "$race_found" -eq 1 ]; then
          echo "::error::genuine ThreadSanitizer data race detected -- see log above"
          exit 1
        fi
        if grep -qE "[0-9]+ (failed|error)|Fatal Python error|pthread_kill failed at suspend" "$LOGFILE"; then
          echo "::error::pytest reported a real failure, or the process crashed -- see log above"
          exit 1
        fi
        exit 0
    - name: Run TSAN-instrumented concurrency tests (single pass)
      run: |
        set -o pipefail
        LOGFILE="${{ github.workspace }}/tsan-output-broad-git-single-user.log"
        status=0
        tsan_version="git-tsan"
        tsan_version="${tsan_version%-tsan}"
        tsan_concurrency_selection="concurrency"
        if [ "single-user" = single-user ] && { [ "$tsan_version" = nix_2_34 ] || [ "$tsan_version" = nix_2_35 ]; }; then
          # Nix master no longer crashes this LocalStore workload under TSAN.
          tsan_concurrency_selection="concurrency and not known_nix_tsan_localstore_bug"
        fi
        unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_CORE_DEBUG=1 NANOPYNIX_RPC_TIMEOUT=30 PYTHONDONTWRITEBYTECODE=1 \
          ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --capture=no --run-temp-store-builds -m "$tsan_concurrency_selection" \
          2>&1 | tee -a "$LOGFILE" || status=$?
        echo "=== TSAN broad pass exit status: $status ===" | tee -a "$LOGFILE"
        if grep -q "ThreadSanitizer: data race" "$LOGFILE"; then
          echo "::error::genuine ThreadSanitizer data race detected -- see log above"
          exit 1
