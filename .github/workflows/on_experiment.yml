# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_experiment.nix; a pytest run renders this file again.

name: Experiment
'on':
  workflow_dispatch:
    inputs:
      experiment:
        description: Attribute of ci/experiments.nix to run
        required: true
        type: string
      matrix:
        default: '{"run":[1]}'
        description: JSON matrix, for example {"arm":["a","b"],"run":[1,2]}
        required: false
        type: string
      ref:
        default: ci-develop
        description: Branch, tag, or FULL 40-character sha to check out
        required: false
        type: string
      runner:
        default: ubuntu-24.04
        description: Runner to use
        options:
        - ubuntu-24.04
        - ubuntu-24.04-arm
        required: false
        type: choice
env:
  UMBRELLA_GIT: '1'
jobs:
  experiment:
    runs-on: ${{ inputs.runner }}
    needs:
    - umbrella-rev
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    timeout-minutes: 170
    steps:
    - name: Make room on the runner
      run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup
        /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell
        /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google
        /usr/lib/firefox; docker system prune --all --force; docker builder prune
        --all --force; df -h /
      timeout-minutes: 10
    - uses: actions/checkout@main
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - name: Check the ref
      run: nix run --file . ciSteps.check-dispatch-ref
      env:
        REF: ${{ inputs.ref }}
      timeout-minutes: 10
    - uses: actions/checkout@main
      with:
        ref: ${{ inputs.ref }}
      timeout-minutes: 10
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
      timeout-minutes: 15
    - name: Enable Nix sandbox namespaces
      run: nix run --file . ciSteps.enable-sandbox-namespaces
      timeout-minutes: 10
    - name: Run ${{ inputs.experiment }}
      run: nix run --file . "experiments.$EXPERIMENT"
      env:
        EXPERIMENT: ${{ inputs.experiment }}
        MATRIX_JSON: ${{ toJSON(matrix) }}
      timeout-minutes: 60
    - name: Keep the evidence of a failed cell
      uses: actions/upload-artifact@main
      if: ${{ failure() }}
      with:
        name: experiment-${{ inputs.experiment }}-${{ strategy.job-index }}
        path: |
          /tmp/core.*
          .pytest-agent/
      timeout-minutes: 15
  umbrella-rev:
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 100
    - name: Resolve the umbrella revision
      id: resolve
      run: ci/walkback.sh https://github.com/nixidae/nixidae nanopynix | sed 's/^/rev=/'
        >> "$GITHUB_OUTPUT"
