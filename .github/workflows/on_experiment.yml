# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_experiment.nix; a pytest run renders this file again.

name: Experiment
env:
  FLAKE_COMPATISH_DISABLE_OVERRIDES: '1'
'on':
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: Branch, tag, or FULL 40-character sha to check out
        required: false
        default: ci-develop
      matrix:
        type: string
        description: JSON matrix, for example {"arm":["a","b"],"run":[1,2]}
        required: false
        default: '{"run":[1]}'
      experiment:
        type: string
        description: Attribute of ci/experiments.nix to run
        required: true
      runner:
        type: choice
        description: Runner to use
        required: false
        default: ubuntu-24.04
        options:
        - ubuntu-24.04
        - ubuntu-24.04-arm
jobs:
  experiment:
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - name: Check the ref
      env:
        REF: ${{ inputs.ref }}
      timeout-minutes: 10
      run: nix run --file . ciSteps.check-dispatch-ref
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: ${{ inputs.ref }}
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Run ${{ inputs.experiment }}
      env:
        EXPERIMENT: ${{ inputs.experiment }}
        MATRIX_JSON: ${{ toJSON(matrix) }}
      timeout-minutes: 60
      run: nix run --file . "experiments.$EXPERIMENT"
    - name: Keep the evidence of a failed cell
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: experiment-${{ inputs.experiment }}-${{ strategy.job-index }}
        path: |
          /tmp/core.*
          .pytest-agent/
      if: ${{ failure() }}
    timeout-minutes: 160
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
