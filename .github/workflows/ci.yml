name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            extra-experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix

      - name: Verify Nix
        run: nix build --version

      - name: Run checks
        run: nix develop --file shell.nix --command just precommit
