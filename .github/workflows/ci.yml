name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            extra-experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix

      - name: Verify Nix
        run: nix build --version

      - name: Setup Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-

      - name: Install Python deps
        run: |
          pip install -e ".[test]"
          pip install pyright ruff

      - name: Type checks
        run: pyright .

      - name: Lint check
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run tests
        run: |
          pytest tests/functional tests/unit -q --tb=short
