name: CI

on:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  matrix:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@main

      - uses: nixbuild/nix-quick-install-action@master

      - id: versions
        name: Compute Nix version matrix
        run: echo "versions=$(nix eval --json '.#nanopynixVersionNames.x86_64-linux')" >> "$GITHUB_OUTPUT"

  test:
    if: github.event_name != 'schedule'
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.versions) }}
        nix_install: [single-user, multi-user]
    steps:
      - uses: actions/checkout@main

      - if: matrix.nix_install == 'single-user'
        uses: nixbuild/nix-quick-install-action@master

      - if: matrix.nix_install == 'multi-user'
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@master
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Configure single-user Nix builds
        if: matrix.nix_install == 'single-user'
        run: |
          sudo install -d -m 0755 /etc/nix
          printf '%s\n' 'build-users-group =' 'require-drop-supplementary-groups = false' | sudo tee -a /etc/nix/nix.conf

      - name: Build nanopynix test runner for Nix ${{ matrix.version }}
        run: nix build ".#nanopynix-tests-${{ matrix.version }}" --out-link result --print-build-logs --print-out-paths

      - name: Verify test runner closure after build
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Enable Nix sandbox namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test nanopynix against Nix ${{ matrix.version }}
        run: unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_RPC_TIMEOUT=30 PYTHONDONTWRITEBYTECODE=1 COVERAGE_FILE=${{ github.workspace }}/.coverage ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --run-temp-store-builds --cov --cov-branch --cov-report=xml:${{ github.workspace }}/coverage.xml --junitxml=${{ github.workspace }}/junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@main
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.xml
          flags: ${{ matrix.version }}-${{ matrix.nix_install }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@main
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/junit.xml
          flags: ${{ matrix.version }}-${{ matrix.nix_install }}
          report_type: test_results

      - name: Verify test runner closure after tests
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

  docs-build:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/develop'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@main

      - uses: nixbuild/nix-quick-install-action@master

      - uses: cachix/cachix-action@master
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Build documentation
        run: nix build .#nanopynix-docs --out-link result --print-build-logs --print-out-paths

      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -r --no-preserve=mode,ownership result/. public/

      - uses: actions/upload-pages-artifact@main
        with:
          path: public

  docs-deploy:
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/develop'
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main

  update-lockfile-prep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: main

      - uses: nixbuild/nix-quick-install-action@master

      - uses: cachix/cachix-action@master
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Update flake inputs
        run: nix flake update

      - id: versions
        name: Compute Nix version matrix
        run: echo "versions=$(nix eval --json '.#nanopynixVersionNames.x86_64-linux')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@main
        with:
          name: flake-lock
          path: flake.lock

  update-lockfile-test:
    if: github.event_name == 'schedule'
    needs: update-lockfile-prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile-prep.outputs.versions) }}
    steps:
      - uses: actions/checkout@main
        with:
          ref: main

      - uses: actions/download-artifact@main
        with:
          name: flake-lock

      - uses: nixbuild/nix-quick-install-action@master

      - uses: cachix/cachix-action@master
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Configure single-user Nix builds
        run: |
          sudo install -d -m 0755 /etc/nix
          printf '%s\n' 'build-users-group =' 'require-drop-supplementary-groups = false' | sudo tee -a /etc/nix/nix.conf

      - name: Build nanopynix test runner for Nix ${{ matrix.version }}
        run: nix build ".#nanopynix-tests-${{ matrix.version }}" --out-link result --print-build-logs --print-out-paths

      - name: Verify test runner closure after build
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Enable Nix sandbox namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test nanopynix against Nix ${{ matrix.version }}
        run: unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_RPC_TIMEOUT=30 PYTHONDONTWRITEBYTECODE=1 ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --run-temp-store-builds

      - name: Verify test runner closure after tests
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

  update-lockfile-commit:
    if: github.event_name == 'schedule'
    needs: update-lockfile-test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@main
        with:
          ref: main

      - uses: actions/download-artifact@main
        with:
          name: flake-lock

      - uses: step-security/git-auto-commit-action@main
        with:
          commit_message: "nix flake update"
