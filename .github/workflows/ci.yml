    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
    - uses: actions/checkout@main
      with:
        ref: main
    - uses: nixbuild/nix-quick-install-action@master
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Update flake inputs
      run: nix flake update
    - name: Compute Nix version matrix
      run: 'echo "versions=$(nix eval --json ''.#packages.x86_64-linux'' --apply ''pkgs:
        map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n:
        builtins.match "nanopynix-tests-.*" n != null) (builtins.attrNames pkgs))'')"
