name: CI

on:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: cachix/cachix-action@v17
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Configure single-user Nix builds
        run: |
          sudo install -d -m 0755 /etc/nix
          printf '%s\n' 'build-users-group =' 'require-drop-supplementary-groups = false' | sudo tee -a /etc/nix/nix.conf

      - name: Show Nix configuration
        run: nix config show

      - name: Build all supported Nix versions
        run: nix build .#nanopynix-all-tests --out-link result --print-build-logs --print-out-paths

      - name: Enable Nix sandbox namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test all supported Nix versions
        run: unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_RPC_TIMEOUT=30 ./result/bin/nanopynix-nix-version-tests --verbose --tb=short -x -rsxXfE --run-temp-store-builds

  update-lockfile:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: cachix/cachix-action@v17
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Configure single-user Nix builds
        run: |
          sudo install -d -m 0755 /etc/nix
          printf '%s\n' 'build-users-group =' 'require-drop-supplementary-groups = false' | sudo tee -a /etc/nix/nix.conf

      - name: Show Nix configuration
        run: nix config show

      - name: Update flake inputs
        run: nix flake update

      - name: Build all supported Nix versions
        run: nix build .#nanopynix-all-tests --out-link result --print-build-logs --print-out-paths

      - name: Enable Nix sandbox namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          unshare --user --map-root-user --mount --pid --fork --mount-proc true

      - name: Test all supported Nix versions
        run: unshare --user --map-root-user --mount --pid --fork --mount-proc env NANOPYNIX_RPC_TIMEOUT=30 ./result/bin/nanopynix-nix-version-tests --verbose --tb=short -x -rsxXfE --run-temp-store-builds

      - uses: step-security/git-auto-commit-action@v7
        with:
          commit_message: "nix flake update"
