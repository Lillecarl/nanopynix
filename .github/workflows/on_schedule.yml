        set -o pipefail
        env NANOPYNIX_CORE_DEBUG=1 PYTHONDONTWRITEBYTECODE=1 NANOPYNIX_RPC_TIMEOUT=30 \
          ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --capture=no --run-temp-store-builds --nix-test-backends ${{ matrix.backend }} \
          -m soak
    - name: Upload test output
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: test-output-${{ matrix.backend }}-${{ matrix.version }}
        path: ${{ github.workspace }}/test-gdb-output.log
