# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_schedule.nix; a pytest run renders this file again.

name: On schedule
'on':
  schedule:
  - cron: 17 3 * * *
  workflow_dispatch:
    inputs:
      jobs:
        default: ''
        description: Comma-separated job IDs to run; leave empty for the full matrix
        required: false
        type: string
jobs:
  docs-build:
    runs-on: ubuntu-24.04
    needs:
    - static-checks
    - test-asan
    - test-nogc
    - test-regular
    - test-tsan
    - test-ubsan
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',docs-build,')
    timeout-minutes: 125
    steps:
    - uses: actions/checkout@main
      with:
        ref: ${{ github.ref_name }}
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
      timeout-minutes: 15
    - uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
      timeout-minutes: 15
    - name: Build documentation
      run: nix build --file . nanopynix-docs --out-link result --print-build-logs
        --print-out-paths
      timeout-minutes: 30
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
      timeout-minutes: 15
    - name: Prepare Pages artifact
      run: nix run --file . ciSteps.prepare-pages
      timeout-minutes: 10
    - uses: actions/upload-pages-artifact@main
      with:
        path: public
      timeout-minutes: 15
  docs-deploy:
    runs-on: ubuntu-24.04
    needs: docs-build
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',docs-deploy,')
    permissions:
      id-token: write
      pages: write
    concurrency:
      cancel-in-progress: false
      group: pages
    timeout-minutes: 37
    steps:
    - name: Report what the gating jobs did
      run: 'echo "the jobs this deploy waits for finished as: $GATE_RESULTS"'
      if: ${{ always() }}
      env:
        GATE_RESULTS: ${{ join(needs.*.result, ' ') }}
      timeout-minutes: 2
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@main
      if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        && !contains(needs.*.result, 'skipped') }}
      with:
        timeout: 900000
      timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
  static-checks:
    runs-on: ubuntu-24.04
    needs:
    - version-matrix
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},',
      inputs.jobs), ',static-checks,')
    timeout-minutes: 75
    steps:
    - uses: actions/checkout@main
      with:
        ref: ${{ github.ref_name }}
      timeout-minutes: 10
    - uses: cachix/install-nix-action@master
