        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 10
      uses: step-security/git-auto-commit-action@main
      with:
        commit_message: nix flake update
    timeout-minutes: 45
    permissions:
      contents: write
    runs-on: ubuntu-24.04
