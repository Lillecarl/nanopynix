# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/on_schedule.nix; a pytest run renders this file again.

name: On schedule
env:
  FLAKE_COMPATISH_DISABLE_OVERRIDES: '1'
'on':
  workflow_dispatch: null
  schedule:
  - cron: 17 3 * * *
jobs:
  static-checks:
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Run the gates (format, grpclib-transports, lint, lint-strict, pytest-agent,
        shell, types)
      timeout-minutes: 20
      run: nix build --file . --no-link --print-build-logs --keep-going checks.format
        checks.grpclib-transports checks.lint checks.lint-strict checks.pytest-agent
        checks.shell checks.types
    timeout-minutes: 85
    runs-on: ubuntu-24.04
  docs-build:
    needs:
    - static-checks
    - test-asan
    - test-nogc
    - test-regular
    - test-tsan
    - test-ubsan
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build documentation
      timeout-minutes: 30
      run: nix build --file . nanopynix-docs --out-link result --print-build-logs
        --print-out-paths
    - name: Verify docs closure
      timeout-minutes: 15
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    - name: Prepare Pages artifact
      timeout-minutes: 10
      run: nix run --file . ciSteps.prepare-pages
    - timeout-minutes: 15
      uses: actions/upload-pages-artifact@main
      with:
        path: public
    timeout-minutes: 135
    runs-on: ubuntu-24.04
  docs-deploy:
    needs: docs-build
    steps:
    - name: Deploy to GitHub Pages
      timeout-minutes: 20
      uses: actions/deploy-pages@main
      with:
        timeout: 900000
      id: deployment
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
  test-regular:
    env:
      CI_STEP: ciSteps.${{ matrix.version }}
      BACKEND: ${{ matrix.backend }}
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build the CI step package for Nix ${{ matrix.version }}
      timeout-minutes: 30
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
    - name: Verify test runner closure after build
      timeout-minutes: 15
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Test nanopynix against Nix ${{ matrix.version }} (full suite, ${{ matrix.backend
        }} backend)
      timeout-minutes: 30
      run: ./result/bin/nanopynix-ci suite
    - name: Run the concurrency soak (${{ matrix.version }}, ${{ matrix.backend }}
        backend)
      timeout-minutes: 15
      run: ./result/bin/nanopynix-ci soak
    - name: Upload test output
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: test-output-${{ matrix.backend }}-${{ matrix.version }}
        path: ${{ github.workspace }}/test-gdb-output.log
      if: ${{ !cancelled() }}
    - name: Upload Boehm GC thread registration log
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: gc-thread-debug-${{ matrix.backend }}-${{ matrix.version }}
        path: ${{ github.workspace }}/gc-thread-debug.log
      if: ${{ !cancelled() }}
    - name: Upload coverage reports to Codecov
      timeout-minutes: 10
      uses: codecov/codecov-action@main
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/coverage.xml
        flags: ${{ matrix.backend }}-${{ matrix.version }}
      if: ${{ !cancelled() }}
    - name: Upload test results to Codecov
      timeout-minutes: 10
      uses: codecov/codecov-action@main
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ${{ github.workspace }}/junit.xml
        flags: ${{ matrix.backend }}-${{ matrix.version }}
        report_type: test_results
      if: ${{ !cancelled() }}
    - name: Verify test runner closure after tests
      timeout-minutes: 15
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    timeout-minutes: 230
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.regular_versions) }}
        backend:
        - daemon
        - local
  test-ubsan:
    env:
      CI_STEP: ciSteps.${{ matrix.version }}
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build the UBSAN CI step package (${{ matrix.version }})
      timeout-minutes: 60
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Run UBSAN-instrumented suite (${{ matrix.version }}, local backend)
      timeout-minutes: 30
      run: ./result/bin/nanopynix-ci suite
    - name: Run the concurrency soak (UBSAN, ${{ matrix.version }})
      timeout-minutes: 15
      run: ./result/bin/nanopynix-ci soak
    - name: Upload UBSAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: ubsan-report-${{ matrix.version }}
        path: ${{ github.workspace }}/ubsan-output-${{ matrix.version }}.log
      if: ${{ !cancelled() }}
    timeout-minutes: 195
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.ubsan_versions) }}
  test-tsan:
    env:
      CI_STEP: ciSteps.${{ matrix.version }}
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build the TSAN CI step package (${{ matrix.version }})
      timeout-minutes: 45
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Run TSAN-instrumented concurrency soak (five seeds, local+daemon backends)
      timeout-minutes: 25
      run: ./result/bin/nanopynix-ci soak-seeds
    - name: Run TSAN-instrumented concurrency tests (single pass, local+daemon backends)
      timeout-minutes: 20
      run: ./result/bin/nanopynix-ci broad
    - name: Upload TSAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: tsan-race-report-${{ matrix.version }}
        path: |
          ${{ github.workspace }}/tsan-output-${{ matrix.version }}.log
          ${{ github.workspace }}/tsan-output-broad-${{ matrix.version }}.log
          ${{ github.workspace }}/soak-${{ matrix.version }}-run*.json
      if: ${{ !cancelled() }}
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.tsan_versions) }}
  test-nogc:
    env:
      CI_STEP: ciSteps.${{ matrix.version }}
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build the no-collector CI step package (${{ matrix.version }})
      timeout-minutes: 30
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Run the suite without a collector (${{ matrix.version }}, local backend)
      timeout-minutes: 30
      run: ./result/bin/nanopynix-ci suite
    - name: Run the concurrency soak (no collector, ${{ matrix.version }})
      timeout-minutes: 15
      run: ./result/bin/nanopynix-ci soak
    timeout-minutes: 150
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.nogc_versions) }}
  test-asan:
    env:
      CI_STEP: ciSteps.${{ matrix.version }}
    needs:
    - update-lockfile
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Build the ASAN CI step package (${{ matrix.version }})
      timeout-minutes: 60
      run: nix build --file . "$CI_STEP" --out-link result --print-build-logs --print-out-paths
    - name: Enable Nix sandbox namespaces
      timeout-minutes: 10
      run: nix run --file . ciSteps.enable-sandbox-namespaces
    - name: Run ASAN-instrumented suite (${{ matrix.version }}, local backend)
      timeout-minutes: 60
      run: ./result/bin/nanopynix-ci suite
    - name: Run the concurrency soak (ASAN, ${{ matrix.version }})
      timeout-minutes: 15
      run: ./result/bin/nanopynix-ci soak
    - name: Upload ASAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: asan-report-${{ matrix.version }}
        path: ${{ github.workspace }}/asan-output-${{ matrix.version }}.log
