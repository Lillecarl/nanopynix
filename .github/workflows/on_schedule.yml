          exit 1
        fi
        exit 0
    - name: Upload TSAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: tsan-race-report-${{ matrix.version }}
        path: |
          ${{ github.workspace }}/tsan-output-${{ matrix.version }}.log
