      run: |
        set -o pipefail
        LOGFILE="${{ github.workspace }}/asan-output-${{ matrix.version }}.log"
        status=0
        # **`tests/pynix` is out, and run 30895974566 is the reason.**
        # That run reached the 120-minute cap, and its log says what it
        # bought:
        #
        #   806 tests executed, 742 passed, 10 failed, 54 skipped
        #   0 AddressSanitizer reports
        #   killed inside tests/pynix/test_lsp.py
        #
        # **All ten failures were in `tests/pynix`, and none were in
        # `tests/nanopynix`.** Two hours of ASAN found no memory error
        # anywhere, so nothing is lost by the cut and the whole failure
        # set goes with it.
        #
        # The reason it can go is that only instrumented code reports:
        # nanopynix-bindings, the Nix libraries and boost.
        # `tests/nanopynix` drives that surface directly.
        # `tests/pynix` tests a CLI and an LSP server through
        # uninstrumented Python, and reaches the bindings only along
        # paths `tests/nanopynix` already covers. It is also where #44
        # lives.
        #
        # The in-process engine stays, so the acceptance test of issue
        # #35 keeps its ASAN cover: a test that builds an evaluator in
        # the pytest process runs in a fork of it.
        #
        # **Three deadlines, and the default of each one is written for
        # a build with no instrumentation.** Run 30891726124 measured
        # what happens when they stay: tests failed on a clock rather
        # than on an assertion about Nix.
        #
        #   NANOPYNIX_RPC_TIMEOUT      default 300. Six tests died with
        #                              Status.DEADLINE_EXCEEDED at 120.
        #   NANOPYNIX_SHUTDOWN_TIMEOUT default 5. The worker cannot
        #                              answer `Shutdown` in five
        #                              seconds under ASAN.
        #   NANOPYNIX_TEST_TIMEOUT     default 120 (`tests/conftest.py`,
        #                              whose own comment asks for this
        #                              override "for slower
        #                              environments").
        #
        # The first answer to that was 600/120/900, and it cost more
        # than it saved: throughput fell from 15.0 tests a minute to
        # 6.7, because each of the ten failures then waited out a much
        # longer deadline. A deadline exists to make a hang visible,
        # not to sit through one. These are the middle ground, and this
        # job is the measurement run for tighter ones. See #61.
        env NANOPYNIX_CORE_DEBUG=1 NANOPYNIX_RPC_TIMEOUT=180 NANOPYNIX_SHUTDOWN_TIMEOUT=60 NANOPYNIX_TEST_TIMEOUT=300 NANOPYNIX_TEST_SANITIZER=asan PYTHONDONTWRITEBYTECODE=1 \
          ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --capture=no --run-temp-store-builds --nix-test-backends local \
          --ignore=tests/pynix \
          -m "not soak" \
          2>&1 | tee -a "$LOGFILE" || status=$?
        # A sanitizer report is the finding, so read the log rather
        # than trusting the exit status alone: `halt_on_error=1` kills
        # the process that reports, but a report raised inside a
        # forkserver worker can still be reaped into a plain test
        # failure. mkUbsanTestJob says the same thing.
        if grep -qE "AddressSanitizer|LeakSanitizer" "$LOGFILE"; then
          echo "::error::sanitizer report on ${{ matrix.version }} -- see the log above"
          exit 1
        fi
        exit "$status"
    - name: Run the concurrency soak (ASAN, ${{ matrix.version }})
      timeout-minutes: 15
      run: |
        set -o pipefail
        env NANOPYNIX_CORE_DEBUG=1 PYTHONDONTWRITEBYTECODE=1 NANOPYNIX_RPC_TIMEOUT=180 NANOPYNIX_SHUTDOWN_TIMEOUT=60 NANOPYNIX_TEST_TIMEOUT=300 NANOPYNIX_TEST_SANITIZER=asan \
          ./result/bin/nanopynix-tests --verbose --tb=short -rsxXfE --capture=no --run-temp-store-builds --nix-test-backends local \
          -m soak
    - name: Upload ASAN output (${{ matrix.version }})
      timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: asan-report-${{ matrix.version }}
        path: ${{ github.workspace }}/asan-output-${{ matrix.version }}.log
      if: ${{ !cancelled() }}
    timeout-minutes: 220
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.asan_versions) }}
  update-lockfile:
    outputs:
      regular_versions: ${{ steps.versions.outputs.regular_versions }}
      tsan_versions: ${{ steps.versions.outputs.tsan_versions }}
      ubsan_versions: ${{ steps.versions.outputs.ubsan_versions }}
      asan_versions: ${{ steps.versions.outputs.asan_versions }}
      nogc_versions: ${{ steps.versions.outputs.nogc_versions }}
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Update flake inputs
      timeout-minutes: 20
      run: nix flake update
    - name: Compute Nix version matrices
      timeout-minutes: 20
      run: |
        echo "regular_versions=$(nix eval --json '.#packages.x86_64-linux' --apply 'pkgs: map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n: builtins.match "nanopynix-tests-.*" n != null && builtins.match ".*-(tsan|ubsan|asan|nogc)" n == null) (builtins.attrNames pkgs))')" >> "$GITHUB_OUTPUT"
        echo "tsan_versions=$(nix eval --json '.#packages.x86_64-linux' --apply 'pkgs: map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n: builtins.match "nanopynix-tests-.*" n != null && builtins.match ".*-tsan" n != null) (builtins.attrNames pkgs))')" >> "$GITHUB_OUTPUT"
        echo "ubsan_versions=$(nix eval --json '.#packages.x86_64-linux' --apply 'pkgs: map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n: builtins.match "nanopynix-tests-.*" n != null && builtins.match ".*-ubsan" n != null) (builtins.attrNames pkgs))')" >> "$GITHUB_OUTPUT"
        echo "asan_versions=$(nix eval --json '.#packages.x86_64-linux' --apply 'pkgs: map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n: builtins.match "nanopynix-tests-.*" n != null && builtins.match ".*-asan" n != null) (builtins.attrNames pkgs))')" >> "$GITHUB_OUTPUT"
        echo "nogc_versions=$(nix eval --json '.#packages.x86_64-linux' --apply 'pkgs: map (builtins.replaceStrings ["nanopynix-tests-"] [""]) (builtins.filter (n: builtins.match "nanopynix-tests-.*" n != null && builtins.match ".*-nogc" n != null) (builtins.attrNames pkgs))')" >> "$GITHUB_OUTPUT"
      id: versions
    - timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: flake-lock
        path: flake.lock
    timeout-minutes: 110
    runs-on: ubuntu-24.04
  update-lockfile-commit:
    needs: docs-deploy
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 10
      uses: step-security/git-auto-commit-action@main
      with:
        commit_message: nix flake update
    timeout-minutes: 45
    permissions:
      contents: write
    runs-on: ubuntu-24.04
