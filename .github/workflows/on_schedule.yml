    timeout-minutes: 225
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.update-lockfile.outputs.asan_versions) }}
  update-lockfile:
    outputs:
      asan_versions: ${{ steps.versions.outputs.asan_versions }}
      nogc_versions: ${{ steps.versions.outputs.nogc_versions }}
      regular_versions: ${{ steps.versions.outputs.regular_versions }}
      tsan_versions: ${{ steps.versions.outputs.tsan_versions }}
      ubsan_versions: ${{ steps.versions.outputs.ubsan_versions }}
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        name: lillecarl
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        useDaemon: false
    - name: Update flake inputs
      timeout-minutes: 20
      run: nix flake update
    - name: Compute Nix version matrices
      timeout-minutes: 20
      run: nix run --file . ciSteps.version-matrix
      id: versions
    - timeout-minutes: 15
      uses: actions/upload-artifact@main
      with:
        name: flake-lock
        path: flake.lock
    timeout-minutes: 110
    runs-on: ubuntu-24.04
  update-lockfile-commit:
    needs: docs-deploy
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        ref: develop
    - timeout-minutes: 10
      uses: actions/download-artifact@main
      with:
        name: flake-lock
    - timeout-minutes: 10
      uses: step-security/git-auto-commit-action@main
      with:
        commit_message: nix flake update
    timeout-minutes: 45
    permissions:
      contents: write
    runs-on: ubuntu-24.04
