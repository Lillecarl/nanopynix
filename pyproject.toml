[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = [
  ".",
  "nanopynix/src",
  "nanopynix-helpers/src",
  "pynix/src",
  "ekn/src",
  "pytest-agent/src",
  "tests",
  "tests/pynix",
  # Reached by a bare `import beartype_bootstrap` from both the sitecustomize
  # shim beside it and tests/support/beartype_hook.py, because the directory
  # goes on PYTHONPATH rather than being a package under `tests` -- see that
  # module's docstring.
  "tests/_subprocess_startup",
  "docs",
]
exclude = ["**/result*"]

[[tool.pyright.executionEnvironments]]
root = "nanopynix-bindings/src"
# `_ext` is a compiled extension: it exists in a built tree and never in the
# checkout, so the `_ext.pyi` beside the seven area modules is stub-only by
# construction and every import of it trips this rule. Scoped to this
# directory, which contains nothing but those eight files.
#
# This is also where the repo's *other* 68 reports of this rule used to come
# from -- consumers importing `nanopynix_bindings.expr` and friends, which were
# stubs with a `.so` (not a source module) beside them. Giving each area a real
# `.py` retired those; only the one genuinely unavoidable case is left.
reportMissingModuleSource = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "pytest-agent/tests"
extraPaths = ["pytest-agent/tests"]
reportPrivateUsage = "none"

[tool.coverage.run]
source_pkgs = ["nanopynix", "nanopynix_helpers", "pynix"]
branch = true
# The Nix worker runs in a process forked from a `multiprocessing` forkserver
# helper, not a plain subprocess. `concurrency = multiprocessing` plus
# `parallel = true` gives each process its own data file (merged later via
# `coverage combine`); `sigterm` flushes data on graceful worker shutdown.
# The forkserver helper itself is a freshly exec'd interpreter, so it only
# picks up COVERAGE_PROCESS_START via tests/_subprocess_startup/sitecustomize.py,
# whose directory tests/support/beartype_hook.py puts on PYTHONPATH.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.paths]
nanopynix = ["nanopynix/src/nanopynix", "*/site-packages/nanopynix"]
nanopynix_helpers = [
  "nanopynix-helpers/src/nanopynix_helpers",
  "*/site-packages/nanopynix_helpers",
]
pynix = ["pynix/src/pynix", "*/site-packages/pynix"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]
