[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = [
  ".",
  "nanopynix/src",
  "nanopynix-helpers/src",
  "libpynix/src",
  "pynix/src",
  "pytest-agent/src",
  "grpclib-transports/src",
  "completion-spike/src",
  # `_bench_utils`, which the benchmark modules and their conftest import by
  # bare name -- the directory goes on `sys.path` by pytest's rootdir rule
  # rather than being a package.
  "grpclib-transports/benchmarks",
  # `services`, imported the same way by the example scripts that
  # grpclib-transports/tests/test_examples.py runs.
  "grpclib-transports/docs/examples",
  "tests",
  "nanopynix/tests",
  "pynix/tests",
  "libpynix/tests",
  "pynix-lsp/src",
  "pynix-lsp/tests",
  # Reached by a bare `import beartype_bootstrap` from both the sitecustomize
  # shim beside it and `nanopynix_testing.beartype_hook`, because the
  # directory goes on PYTHONPATH rather than being a package -- see that
  # module's docstring.
  "nanopynix-testing/src/nanopynix_testing/_subprocess_startup",
  "docs",
]
# `pynixd/` is imported and not integrated. See the same note in `ruff.toml`:
# that tree keeps its own pyright settings at `pynixd/pyproject.toml`, and a
# strict run from here reported 7629 errors on the day of the import. Issue
# #131 removes this entry, one gate at a time.
exclude = ["**/result*", "pynixd"]

[[tool.pyright.executionEnvironments]]
root = "nanopynix-bindings/src"
# `_ext` is a compiled extension: it exists in a built tree and never in the
# checkout, so the `_ext.pyi` beside the seven area modules is stub-only by
# construction and every import of it trips this rule. Scoped to this
# directory, which contains nothing but those eight files.
#
# This is also where the repo's *other* 68 reports of this rule used to come
# from -- consumers importing `nanopynix_bindings.expr` and friends, which were
# stubs with a `.so` (not a source module) beside them. Giving each area a real
# `.py` retired those; only the one genuinely unavoidable case is left.
reportMissingModuleSource = "none"

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

# A suite reads the private surface of the thing it tests, and the LSP drivers
# call `pynix_lsp._handlers._hover` and its peers directly. This entry says
# for `pynix/tests/` what the one above says for `tests/`: issue #130 moved the
# suite out from under that root, and 18 reports appeared with no code change.
# Each suite that moves needs its own entry.
[[tool.pyright.executionEnvironments]]
root = "nanopynix/tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "pynix/tests"
reportPrivateUsage = "none"

# The CLI layer that issue #222 made a library. Its suite reads
# `libpynix.command._let_a_hash_stay_in_the_line`, which is the correction that
# a completion applies before it answers.
[[tool.pyright.executionEnvironments]]
root = "libpynix/tests"
reportPrivateUsage = "none"

# The drivers call `pynix_lsp._handlers._hover` and its peers directly. Issue
# #107 moved this suite out of `pynix/tests/`, and the entry moved with it.
#
# No `extraPaths` here, unlike the entry below it. `extraPaths` in an execution
# environment replaces the global list rather than adding to it, so an entry
# that named `pynix-lsp/tests` alone lost `pynix-lsp/src` and pyright reported
# 18 `reportMissingTypeStubs` for `pynix_lsp._handlers` and its peers. The
# global list already carries both directories.
[[tool.pyright.executionEnvironments]]
root = "pynix-lsp/tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "pytest-agent/tests"
extraPaths = ["pytest-agent/tests"]
reportPrivateUsage = "none"

[tool.coverage.run]
source_pkgs = ["nanopynix", "nanopynix_helpers", "libpynix", "pynix", "pynix_lsp"]
branch = true
# The Nix worker runs in a process forked from a `multiprocessing` forkserver
# helper, not a plain subprocess. `concurrency = multiprocessing` plus
# `parallel = true` gives each process its own data file (merged later via
# `coverage combine`); `sigterm` flushes data on graceful worker shutdown.
# The forkserver helper itself is a freshly exec'd interpreter, so it only
# picks up COVERAGE_PROCESS_START via the `sitecustomize.py` of
# `nanopynix_testing`, whose directory that project's `beartype_hook` puts on
# PYTHONPATH.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.paths]
nanopynix = ["nanopynix/src/nanopynix", "*/site-packages/nanopynix"]
nanopynix_helpers = [
  "nanopynix-helpers/src/nanopynix_helpers",
  "*/site-packages/nanopynix_helpers",
]
libpynix = ["libpynix/src/libpynix", "*/site-packages/libpynix"]
pynix = ["pynix/src/pynix", "*/site-packages/pynix"]
pynix_lsp = ["pynix-lsp/src/pynix_lsp", "*/site-packages/pynix_lsp"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]
