[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd"
version = "0.1.0"
description = "Python Nix daemon protocol proxy over SSH"
requires-python = ">=3.13"
dependencies = [
    "asyncssh",
    "aiohttp",
    "aiosqlite",
    "environs",
    "pyinstrument",
    "structlog",
    "passlib",
    "cachetools",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "rich",
]

[project.scripts]
pynixd = "pynixd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle errors & warnings
    "E", "W",
    # isort
    "I",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-type-checking
    "TC",
    # Ruff-specific
    "RUF",
    # flake8-comprehensions
    "C4",
    # trailing commas — handled by ruff format, don't select COM812
    # commented-out code
    "ERA",
]

ignore = [
    # E501 line length — we use line-length=120 instead of the default 88
    "E501",
    # contextlib.suppress is slower than try/except; we use the pattern intentionally
    "SIM105",
    # we use `from __future__ import annotations` so cast() doesn't need quotes
    "TC006",
    # trailing whitespace in multi-line strings is expected (SQL, nix exprs)
    "W291",
    # StorePath("") as dataclass default is intentional for protocol messages
    "RUF009",
    # fire-and-forget asyncio.create_task is intentional
    "RUF006",
    # mutable class defaults like _ESCAPE dicts are intentional constants
    "RUF012",
    # collapsing nested ifs is sometimes less readable, especially with comments
    "SIM102",
    # some style preferences: ternary vs if/else, all() vs for-loop, etc.
    "SIM108",
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ERA001", "RUF059", "F401"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
