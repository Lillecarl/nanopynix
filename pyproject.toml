[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd"
version = "0.1.0"
description = "Python Nix daemon protocol proxy over SSH"
requires-python = ">=3.13"
dependencies = [
    "asyncssh",
    "aiohttp",
    "aiosqlite",
    "environs",
    "pyinstrument",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-forked",
]

[project.scripts]
pynixd = "pynixd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP046"]

[tool.pyright]
pythonVersion = "3.13"
