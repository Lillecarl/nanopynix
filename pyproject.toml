[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
extraPaths = [".", "nanopynix/src", "nanopynix-helpers/src", "pynix/src", "pytest-agent/src", "tests", "tests/pynix", "docs"]
exclude = ["**/result*"]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = "none"

[[tool.pyright.executionEnvironments]]
root = "pytest-agent/tests"
extraPaths = ["pytest-agent/tests"]
reportPrivateUsage = "none"

[tool.coverage.run]
source_pkgs = ["nanopynix", "nanopynix_helpers", "pynix"]
branch = true
# The Nix worker runs in a process forked from a `multiprocessing` forkserver
# helper, not a plain subprocess. `concurrency = multiprocessing` plus
# `parallel = true` gives each process its own data file (merged later via
# `coverage combine`); `sigterm` flushes data on graceful worker shutdown.
# The forkserver helper itself is a freshly exec'd interpreter, so it only
# picks up COVERAGE_PROCESS_START via the sitecustomize shim wired in
# tests/conftest.py -- see COVERAGE_PROCESS_START there for the other half.
concurrency = ["multiprocessing", "thread"]
parallel = true
sigterm = true

[tool.coverage.paths]
nanopynix = ["nanopynix/src/nanopynix", "*/site-packages/nanopynix"]
nanopynix_helpers = ["nanopynix-helpers/src/nanopynix_helpers", "*/site-packages/nanopynix_helpers"]
pynix = ["pynix/src/pynix", "*/site-packages/pynix"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:"]
