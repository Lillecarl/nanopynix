[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]
# pynix-lsp's scenario fixtures are test *input*, not source, and formatting
# them is destructive rather than merely noisy.
#
# Most of them carry marker comments whose caret column is load-bearing --
# `pynix/tests/support/lsp_markers.py` reads `#      vLSPOINT8"g"` as "the position
# under this caret, which must be a `g`", and the comments sit at column 0 so
# the carets line up with the code below them. nixfmt indents a comment to
# match its enclosing block, which slides every caret sideways; running it
# across this tree broke 72 LSP tests, each reporting the self-check
# `_check_column` exists to catch.
#
# Two files here are also deliberately unparseable -- `syntax_error.nix` is a
# truncated expression and `completion_target.nix` ends at `cfg.` -- so nixfmt
# cannot format them at all and treefmt exits non-zero on the pair. Excluding
# only those two would silence that error and leave the marker files to be
# re-broken on the next run, so the whole fixture tree is out of scope.
#
# Deliberately not excluded: `pynix/tests/test_search/*.nix`, which are
# ordinary option-tree fixtures with no markers and nothing positional.
#
# Scoped to this formatter rather than made a global exclude because the one
# non-Nix file in the tree, `.helix/languages.toml`, is an editor config for
# driving the server by hand -- taplo formats it cleanly and should keep doing
# so.
excludes = ["pynix/tests/test_lsp/**"]

[formatter.toml]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.python]
command = "ruff"
options = ["format"]
includes = ["*.py"]
