; This project runs its own suite, with its own rootdir. Issue #130 is the
; reason: a Nix invocation should read one project and not the whole
; repository, and that is only true once the tests of a project live beside it.
;
; **No `anyio_mode`, unlike every other project here.** Nothing in this suite
; is async: the subject is argparse and argcomplete, and `Command.run` is the
; one coroutine, which no test here awaits.
;
; **`nanopynix_testing.beartype_hook` is absent on purpose.** That plugin
; imports `nanopynix`, and this project depends on no part of Nix -- see the
; note above `dependencies` in `pyproject.toml`. `test-support/pytest.ini`
; leaves it out for the same reason. The repository run does instrument this
; package: `../pytest.ini` loads the hook, and `PACKAGES` in
; `nanopynix-testing/src/nanopynix_testing/_subprocess_startup/beartype_bootstrap.py`
; names `libpynix`.
;
; `-p` and not `pytest_plugins`: the latter is legal only in a top-level
; conftest, and a run that starts at the repository root makes this project's
; conftest a non-top-level one.
[pytest]
addopts = -p test_support.plugin
testpaths = tests
