; This project runs its own suite, with its own rootdir. Issue #130 is the
; reason: a Nix invocation should read one project and not the whole
; repository, and that is only true once the tests of a project live beside it.
;
; `anyio_mode = auto`, because the suite is async and anyio's plugin otherwise
; stays in strict mode and fails every async test rather than running it. The
; repository `../pytest.ini` does not reach here: pytest anchors the rootdir at
; the nearest `pyproject.toml`, which is this project's own.
;
; **Every plugin is registered here with `-p`, and none in a conftest.**
; `pytest_plugins` is legal only in a top-level conftest, and a run that starts
; at the repository root makes each project's conftest a non-top-level one.
; pytest then fails collection outright with "Defining 'pytest_plugins' in a
; non-top-level conftest is no longer supported". Every job of CI run
; 31706977896 died that way, while each project's own gate stayed green,
; because a gate run makes that same file top-level again.
;
; `-p` has neither restriction: it is processed during command-line parsing,
; before the first conftest. Each name below is an installed package, which is
; what makes it importable that early. A module reached through `pythonpath`
; or through the rootdir is not, and cannot go here.
;
; `nanopynix_testing.beartype_hook` installs beartype's import hook over
; `nanopynix`, `nanopynix_helpers`, `pynix` and `pynix_lsp`. It has to run before those
; packages are imported, and `tests/conftest.py` imports `pynix` at its top, so
; a hook install inside that file would be too late for its own imports.
; A `-p` plugin loads during command-line parsing, which is earlier than any
; conftest. The hook was not importable by that route until issue #130 made it
; an installed package; its module docstring records the reason.
;
; A suite that loses the hook still reports every test as passed, so the
; failure is silent. `nanopynix/tests/test_beartype_instrumentation.py` is what
; catches it.
[pytest]
anyio_mode = auto
addopts = -p nanopynix_testing.beartype_hook
  -p test_support.plugin
  -p nanopynix_testing.nix_environment
  -p nanopynix_testing.nix_runtime
  -p nanopynix_testing.fixtures
testpaths = tests
; No `markers` block. `nanopynix_testing.nix_runtime.pytest_configure` adds
; every `nix_*` marker with `addinivalue_line`, so a copy here would be a
; second list to keep in step with the first.
