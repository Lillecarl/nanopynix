[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynix"
version = "0.1.0"
description = "End-to-end harness that consumes nanopynix as a library dependency"
requires-python = ">=3.13"
dependencies = ["nanopynix", "clypi", "jsonschema", "prompt-toolkit", "pydantic", "pygls", "rapidfuzz", "rich", "structlog", "tree-sitter", "tree-sitter-nix"]

[project.scripts]
pynix = "pynix:main"

[project.optional-dependencies]
test = ["nanopynix[test]", "pytest-lsp"]

[tool.hatch.build.targets.wheel]
packages = ["src/pynix"]
