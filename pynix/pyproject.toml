[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynix"
version = "0.1.0"
description = "End-to-end harness that consumes nanopynix as a library dependency"
requires-python = ">=3.13"
dependencies = [
  "nanopynix",
  "nanopynix-helpers",
  "clypi",
  "jsonschema",
  "prompt-toolkit",
  "pydantic",
  "pygls",
  "rapidfuzz",
  "rich",
  "structlog",
  "tree-sitter",
  "tree-sitter-nix",
]

[project.scripts]
pynix = "pynix:main"

[project.optional-dependencies]
test = ["nanopynix[test]", "pytest-lsp"]
# The documentation toolchain. Declared here rather than wired into the Nix
# build because sphinx has to import what it documents, so it belongs in the
# same environment as pynix and everything pynix depends on.
docs = ["sphinx", "myst-parser", "furo"]

[tool.hatch.build.targets.wheel]
packages = ["src/pynix"]
