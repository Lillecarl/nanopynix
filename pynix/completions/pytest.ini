[pytest]
# **This directory is its own rootdir, and it is not in the repository's
# `testpaths`.** Every test here spawns fish, bash and zsh on a pty and
# completes against an *installed* `pynix` -- a store path with `share/` in it.
# The repository suite runs in the CI matrix against every supported Nix
# version and both backends, and none of those jobs has a shell to drive or an
# installed application to complete, so a run there would report the sandbox
# and not the code.
#
# `checks.pynix-completions` in nix/checks.nix is what runs this, and the dev
# shell carries the three shells so a developer can run it too:
#
#     pytest pynix/completions/tests
testpaths = tests
# `-ra`, because a pty test that fails reports what the shell drew, and that
# report is the whole diagnosis.
addopts = -ra --strict-markers
