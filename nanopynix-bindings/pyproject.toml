[build-system]
requires = ["scikit-build-core >=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "nanopynix-bindings"
version = "0.1.0"
description = "nanobind-based Python bindings for Nix (compiled extensions)"
authors = [{ name = "nanopynix contributors" }]
requires-python = ">=3.13"
# PEP 639, and not the `License ::` classifier that this held before. The
# classifier is a name, and `license-files` is what puts the **text** in the
# wheel. Without it the built wheel carried no licence file at all: its
# `.dist-info` held `METADATA`, `WHEEL` and `RECORD` and nothing else.
#
# The file is a copy of the one at the root of the repository, because the
# source root of this project is `nanopynix-bindings/` and a path above it is
# not in the sdist.
#
# PEP 639 says a `License ::` classifier and a `license` expression must not
# both appear, so the classifier is gone.
#
# **This is the one LGPL project of the repository, and everything else is
# Apache-2.0.** This project links libnixexpr and libnixstore, which Nix
# publishes under LGPL-2.1-or-later, so the licence follows the library. The
# root `LICENSE` is the Apache text, and `LICENSE.LGPL-2.1` beside it is this
# one. `AGENTS.md` says why the two live together without a conflict.
license = "LGPL-2.1-or-later"
license-files = [ "LICENSE" ]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
]

[project.urls]
Homepage = "https://github.com/lillecarl/nanopynix"

[tool.scikit-build]
minimum-version = "build-system.requires"

# **This package is not pure Python, and the wheel has to say so.**
#
# `wheel.platlib = false` used to be here. It writes `Root-Is-Purelib: true`
# and tags the wheel `py3-none-any`, which claims the wheel runs on any Python
# on any platform. The wheel holds `_ext.cpython-314-x86_64-linux-gnu.so`, so
# it runs on CPython 3.14 on x86-64 Linux and nowhere else. pip would install
# it anywhere and the import would then fail.
#
# **Nix hides this.** `buildPythonPackage` puts purelib and platlib in the same
# `site-packages`, so the setting changed nothing that a Nix build can see. It
# became visible at the first real wheel: `auditwheel` refuses a wheel with no
# platform tag.
#
# The default gives `cp314-cp314-linux_x86_64`, which `auditwheel repair` then
# rewrites to a `manylinux` tag.
